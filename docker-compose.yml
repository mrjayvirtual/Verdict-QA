version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: verdict_qa
      POSTGRES_USER: verdict
      POSTGRES_PASSWORD: verdict123
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  api:
    build:
      context: .
      dockerfile: docker/Dockerfile.api
    ports:
      - "3001:3001"
    depends_on:
      - postgres
    environment:
      DATABASE_URL: postgresql://verdict:verdict123@postgres:5432/verdict_qa
      NODE_ENV: development

volumes:
  postgres_data:
